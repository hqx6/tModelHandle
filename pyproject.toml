[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tmodelhandle"
version = "0.1.0"
description = "Offline OBJ to georeferenced 3D Tiles with task UI"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
model-tiler = "model_tiler.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
model_tiler = ["web/*"]
