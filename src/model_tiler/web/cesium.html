<!DOCTYPE html><html lang="zh-CN"><head><meta charset="utf-8"><title>3D Tiles 地球预览</title><link href="https://cdn.jsdelivr.net/npm/cesium@1.123.1/Build/Cesium/Widgets/widgets.css" rel="stylesheet"><style>html,body,#viewer{margin:0;width:100%;height:100%;overflow:hidden}#status{position:absolute;top:12px;left:12px;background:#14232ddd;color:#c7f8eb;padding:12px;z-index:5;font:13px sans-serif;max-width:480px}#status a{color:#9df1d9}</style></head><body><div id="viewer"></div><div id="status">正在加载 Cesium… 此地球预览需要连接 CDN。<br><a href="/">返回离线模型预览</a></div><script>window.CESIUM_BASE_URL='https://cdn.jsdelivr.net/npm/cesium@1.123.1/Build/Cesium/';</script><script src="https://cdn.jsdelivr.net/npm/cesium@1.123.1/Build/Cesium/Cesium.js" onerror="document.getElementById('status').firstChild.textContent='Cesium 加载失败，请检查网络，或返回离线模型预览。'"></script><script>
(async()=>{if(!window.Cesium)return;try{const id=new URLSearchParams(location.search).get('task');if(!/^[0-9a-f]{32}$/.test(id||''))throw new Error('任务 ID 无效');
const viewer=new Cesium.Viewer('viewer',{baseLayer:false,geocoder:false,animation:false,timeline:false,baseLayerPicker:false,navigationHelpButton:false,terrainProvider:new Cesium.EllipsoidTerrainProvider()});
window.viewer=viewer;viewer.scene.globe.baseColor=Cesium.Color.fromCssColorString('#192a35');
const tileset=await Cesium.Cesium3DTileset.fromUrl(`/artifacts/${id}/output/tileset.json`);window.tileset=tileset;viewer.scene.primitives.add(tileset);await viewer.zoomTo(tileset,new Cesium.HeadingPitchRange(.5,-.55,Math.max(tileset.boundingSphere.radius*4,100)));document.getElementById('status').firstChild.textContent='3D Tiles 已加载 · 点击构件查看属性';
const handler=new Cesium.ScreenSpaceEventHandler(viewer.scene.canvas);handler.setInputAction(click=>{const f=viewer.scene.pick(click.position);if(f instanceof Cesium.Cesium3DTileFeature){document.getElementById('status').firstChild.textContent=f.getPropertyIds().map(k=>`${k}: ${f.getProperty(k)}`).join(' | ');}},Cesium.ScreenSpaceEventType.LEFT_CLICK);
}catch(error){document.getElementById('status').firstChild.textContent='加载失败：'+error.message;}})();
</script></body></html>
